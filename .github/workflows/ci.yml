name: CI Workflow - Develop to Master

on:
  pull_request:
    branches:
      - master
  workflow_run:
    workflows: [CI Workflow - Feature to Develop]
    types: [completed]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: latest  # Inicijalizuješ RELEASE_TAG sa "latest", možeš kasnije menjati

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Build
        run: |
          docker build -t myapp:latest .
          
      - name: Push Docker Image to Docker Hub
        run: |
          docker tag myapp:latest mydockerhubuser/myapp:latest
          docker push mydockerhubuser/myapp:latest  # Pushing Docker image to Docker Hub
