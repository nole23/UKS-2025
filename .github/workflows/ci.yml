name: CI Workflow - Develop to Master

on:
  pull_request:
    branches:
      - master
  workflow_run:
    workflows: [CI Workflow - Feature to Develop]
    types: [completed]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: latest  # Po specifikaciji, verzije nisu potrebne

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Django server image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uks-server:latest ./uks-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uks-server:latest

      - name: Build and push Angular client image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uks-client:latest ./uks-client
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uks-client:latest

      - name: Build and push Nginx image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uks-nginx:latest ./nginx
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uks-nginx:latest
