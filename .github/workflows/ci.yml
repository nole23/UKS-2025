name: CI Workflow

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - feature/*  # Ovaj deo se aktivira samo za feature grane, možeš ga prilagoditi

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies for Django
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django build and unit tests
        run: |
          python manage.py migrate
          python manage.py test

      - name: Set up Node.js for Angular
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies for Angular
        run: |
          cd angular-project-folder
          npm install

      - name: Run Angular unit tests
        run: |
          cd angular-project-folder
          ng test --watch=false

      - name: Run Acceptance Tests (AT)
        run: |
          # Dodaj ovde komande za pokretanje Acceptance Testova
          echo "Running Acceptance Tests..."
        
      - name: Push results to GitHub if tests pass
        if: success() 
        run: echo "All tests passed, ready to merge!"

  code_review:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check if PR is ready for merge
        run: |
          # Možeš da koristiš GitHub API ili GitHub CLI za proveru statusa PR-a
          # Ovaj korak se koristi za obavestenje da li je neko od članova odobrio PR
          echo "Waiting for code review..."
          
      - name: Merge the PR automatically
        if: success() && github.event.pull_request.reviewers[0].approved == true
        run: |
          echo "Merge is allowed, merging the PR..."
          gh pr merge ${{ github.event.pull_request.number }} --merge
