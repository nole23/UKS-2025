name: CI Workflow

on:
  pull_request:
    branches:
      - develop  # Pokreće workflow kada neko otvori PR prema develop grani

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Timeout za build job

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies for Django
        run: |
          # Navigiraj u Django aplikaciju
          cd uks-server/uks
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django migrations and unit tests
        run: |
          cd uks-server/uks  # Navigiraj do Django aplikacije
          python manage.py migrate
          python manage.py test

      - name: Set up Node.js for Angular
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Preporučena verzija Node.js za Angular, možeš promeniti ako je potrebno

      - name: Install dependencies for Angular
        run: |
          cd angular-project-folder  # Prebaci se u direktorijum gde je Angular projekat
          npm install

      - name: Build Angular app
        run: |
          cd angular-project-folder  # Prebaci se u direktorijum gde je Angular projekat
          ng build --prod  # Build pre testiranja

      - name: Run Angular unit tests
        run: |
          cd angular-project-folder  # Prebaci se u direktorijum gde je Angular projekat
          ng test --watch=false  # Pokreni Angular unit testove

      - name: Run Acceptance Tests (AT)
        run: |
          # Dodaj ovde komande za pokretanje Acceptance Testova
          echo "Running Acceptance Tests..."

      - name: Push results to GitHub if tests pass
        if: success() 
        run: echo "All tests passed, ready to merge!"

  code_review:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check if PR is ready for merge
        run: |
          # Možeš da koristiš GitHub API ili GitHub CLI za proveru statusa PR-a
          echo "Waiting for code review..."

      - name: Merge the PR automatically
        if: success() && github.event.pull_request.reviewers[0].approved == true
        run: |
          echo "Merge is allowed, merging the PR..."
          gh pr merge ${{ github.event.pull_request.number }} --merge
