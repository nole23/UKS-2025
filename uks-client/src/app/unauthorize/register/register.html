<div class="container">
    <!-- Back dugme u gornjem levom uglu -->
    <button class="back-btn" (click)="goHome()">← Back</button>

    <h2>Register</h2>
    <form [formGroup]="registerForm" (ngSubmit)="register()">
        <input formControlName="username" placeholder="Username" required /><br/>
        <input formControlName="email" type="email" placeholder="Email" required /><br/>
        <input formControlName="first_name" placeholder="First Name" /><br/>
        <input formControlName="last_name" placeholder="Last Name" /><br/>
        <input formControlName="password" type="password" placeholder="Password" required /><br/>
        <input formControlName="password2" type="password" placeholder="Confirm Password" required /><br/>
        <button type="submit">Register</button>
    </form>
<p class="message" [ngClass]="{'error': isError}">{{message}}</p>
</div>
